global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ledger
    # Scraped over the internal network, not through Caddy, which is why the
    # Caddyfile can return 404 for /metrics without breaking monitoring.
    static_configs:
      - targets: ['ledger:8080']
