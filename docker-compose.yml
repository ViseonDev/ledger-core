name: ledger-core

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledger_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ledger}
      # Require SCRAM-SHA-256 authentication even locally to catch configuration mistakes early.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # pg_isready with -d checks that the target database is ready, avoiding startup races.
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ledger} -d ${POSTGRES_DB:-ledger}" ]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  redis:
    image: redis:8.10-alpine
    restart: unless-stopped
    command: [ "redis-server", "--save", "60", "1", "--appendonly", "no" ]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 2s
      timeout: 3s
      retries: 15

  ledger:
    build:
      context: .
      target: runtime
      args:
        VERSION: ${VERSION:-dev}
    restart: unless-stopped
    environment:
      LEDGER_HTTP_ADDR: ":8080"
      LEDGER_GRPC_ADDR: ":9090"
      LEDGER_LOG_LEVEL: ${LEDGER_LOG_LEVEL:-info}
      LEDGER_LOG_FORMAT: ${LEDGER_LOG_FORMAT:-text}
      LEDGER_POSTGRES_URL: postgres://${POSTGRES_USER:-ledger}:${POSTGRES_PASSWORD:-ledger_dev_password}@postgres:5432/${POSTGRES_DB:-ledger}?sslmode=disable
      LEDGER_REDIS_ADDR: redis:6379
    ports:
      - "${LEDGER_HTTP_PORT:-8080}:8080"
      - "${LEDGER_GRPC_PORT:-9090}:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Built-in busybox wget is used instead of adding curl to the minimal runtime image.
      test: [ "CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/healthz || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Operator commands: tools profile prevents running on normal compose up.
  ledgerctl:
    profiles: [ "tools" ]
    build:
      context: .
      target: runtime
    entrypoint: [ "/usr/local/bin/ledgerctl" ]
    environment:
      LEDGER_LOG_LEVEL: ${LEDGER_LOG_LEVEL:-info}
      LEDGER_LOG_FORMAT: ${LEDGER_LOG_FORMAT:-text}
      LEDGER_POSTGRES_URL: postgres://${POSTGRES_USER:-ledger}:${POSTGRES_PASSWORD:-ledger_dev_password}@postgres:5432/${POSTGRES_DB:-ledger}?sslmode=disable
      LEDGER_REDIS_ADDR: redis:6379
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:

