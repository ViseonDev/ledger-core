# Local development override merged on top of docker-compose.yml.

services:
  ledger:
    build:
      target: dev
    # Mount source tree and named cache volumes for fast incremental air rebuilds.
    volumes:
      - .:/src
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    environment:
      LEDGER_LOG_LEVEL: debug
      LEDGER_LOG_FORMAT: text
    ports:
      - "${LEDGER_HTTP_PORT:-8080}:8080"
      - "${LEDGER_GRPC_PORT:-9090}:9090"
      # Delve debug port (attach with: dlv connect localhost:2345)
      - "${LEDGER_DEBUG_PORT:-2345}:2345"
    user: root

  postgres:
    # Log statements locally for clear debugging.
    command:
      - postgres
      - -c
      - log_statement=all
      - -c
      - log_min_duration_statement=0

volumes:
  go-mod-cache:
  go-build-cache:

